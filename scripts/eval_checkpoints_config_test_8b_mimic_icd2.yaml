# One-off test-split eval of the 8b-full-mimic-icd2 checkpoint
# (ft-8b-full-mimic-2icd-v1-4), for the no-reasoning (label-only + ICD
# oversampling) comparison row in Table tab:main (paper/EACL_2026_submission).
#
# Epoch pinned to 4: dev-split ICD F1 Macro peaks at e4 (12.51) vs e3 (12.25)
# -- see data/eval_metrics_merlin-eval-1.4.csv rows "8b-full-mimic-icd2-e*"
# and table_ablation.tex ("mimic-icd2" row, which is this checkpoint's dev
# numbers). This matches the "best epoch selected on dev by ICD macro-F1"
# convention used for every other row in Table tab:main.
#
# short_name is "test-"-prefixed so it doesn't collide with the existing
# "8b-full-mimic-icd2-e*" dev-split state entries in
# data/results/eval_checkpoints_state.json -- job comes out as
# "test-8b-mimic-icd2-e4".
#
# Run with:
#   python scripts/eval_checkpoints.py \
#       --config scripts/eval_checkpoints_config_test_8b_mimic_icd2.yaml
#
# Logs to merlin-eval (wandb_tags: test_data), same tag convention as the
# other test-split reruns. Safe to delete this file after the run.

namespace: merlin
server_image: registry.example.com/anon/vllm_server:latest
client_image: registry.example.com/anon/vllm_client:latest

models_root: /ft_models/sft

pvc:
  tool_pod: tool-anon
  ft_root: /ft_models
  tool_root: /merlin_ddx

manifests:
  - path: /ft_models/sft/ft-8b-full-mimic-2icd-v1-4/checkpoints.json
    short_name: test-8b-mimic-icd2
    server_gpu: b200
    epochs: 4

epochs: []
max_pending: 2

Hardware:
  server_gpu: [b200, h200, h100]   # overridden to b200 above
  client_gpu: p100
  gpu_count: 1
  replicas: 1
  gpu_memory_utilization: 0.85
  enforce_eager: True

Model:
  max_model_len: 8192
  max_num_seqs: 512
  max_num_batched_tokens: 8192
  dtype: "auto"
  thinking: False

Client_Job:
  chief_complaint: "all"
  file_name: "test_dataset"
  split: "test"                    # test-set eval, not the dev sweep
  wandb_tags: "test_data"
  num_choices: 4
  num_samples: 100000
  concurrency: 64
  start_verifier: 1
  budget: [4, 4, 4, 4]
  temperatures: [0.4, 0.4, 0.4, 0.4]
  max_tokens: [2000, 2000, 2000, 2200]
  thresholds: [0.6, 0.5, 0.8, 0.55]
  seed: 42
  eval_mode: True
  merlin_mode: True
  think_about_labs: False
  guided_decoding: False
