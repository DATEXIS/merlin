# True per-epoch watcher (not wait-for-job-completion) for the mimic-icd2
# (no reasoning traces) seed-44 retrain, ft-8b-full-mimic-2icd-seed44-v1-4
# (run_plan.yaml, added 2026-07-29). Companion:
# watch_epochs_mimic2icd_seed43.yaml -- see that file's header for the full
# rationale (same recipe here, just seed 44 instead of 43).
#
# Run (leave running in a terminal/tmux for as long as training takes --
# polls every 10 min by default, evaluates whatever's newly ready; safe
# to run alongside watch_epochs_mimic2icd_seed43.yaml and the training jobs):
#   python scripts/watch_and_eval_epochs.py --config scripts/watch_epochs_mimic2icd_seed44.yaml

namespace: merlin
server_image: registry.example.com/anon/vllm_server:latest
client_image: registry.example.com/anon/vllm_client:latest

models_root: /ft_models/sft

pvc:
  tool_pod: tool-anon
  ft_root: /ft_models
  tool_root: /merlin_ddx

manifests:
  - path: /ft_models/sft/ft-8b-full-mimic-2icd-seed44-v1-4/checkpoints.json
    short_name: 8b-full-mimic-icd2-seed44
    server_gpu: b200

# []: sweep whatever epochs exist in the manifest right now.
epochs: []
max_pending: 2

Hardware:
  server_gpu: [b200, h200, h100]   # overridden to b200 above
  client_gpu: p100
  gpu_count: 1
  replicas: 1
  gpu_memory_utilization: 0.85
  enforce_eager: True

Model:
  max_model_len: 8192
  max_num_seqs: 512
  max_num_batched_tokens: 8192
  dtype: "auto"
  thinking: False
  lora: False
  full_finetuning: False
  lora_modules: ""

Client_Job:
  chief_complaint: "all"
  file_name: "test_dataset"
  split: "dev"                    # epoch selection, not paper reporting -- see header
  num_choices: 4
  num_samples: 100000
  concurrency: 64
  start_verifier: 1
  budget: [4, 4, 4, 4]
  temperatures: [0.4, 0.4, 0.4, 0.4]
  max_tokens: [2000, 2000, 2000, 2200]
  thresholds: [0.6, 0.5, 0.8, 0.55]
  seed: 44
  eval_mode: True
  merlin_mode: True
  think_about_labs: False
  guided_decoding: False
