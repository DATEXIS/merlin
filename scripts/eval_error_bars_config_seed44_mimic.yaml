# Error-bar seed for the main table's "label-only (no traces)" row --
# 8B full-FT on mimic-2icd (ft-8b-full-mimic-2icd-v1-4), seed-44 half.
# Companion to eval_error_bars_config_seed43_mimic.yaml (seed 43) -- see
# that file's header for the full rationale (why this row, client_gpu
# split from eval_error_bars_config_seed44_8b.yaml, no new SFT, checkpoint/
# epoch pinning, and the wandb doubled-suffix quirk).
#
# short_name carries a "-seed44" suffix, matching the seed43 file's
# "-seed43" convention.
#
# Run:
#   python scripts/eval_checkpoints.py --config scripts/eval_error_bars_config_seed44_mimic.yaml

namespace: merlin
server_image: registry.example.com/anon/vllm_server:latest
client_image: registry.example.com/anon/vllm_client:latest

models_root: /ft_models/sft

pvc:
  tool_pod: tool-anon
  ft_root: /ft_models
  tool_root: /merlin_ddx

manifests:
  - path: /ft_models/sft/ft-8b-full-mimic-2icd-v1-4/checkpoints.json
    short_name: test-8b-mimic-icd2-seed44
    server_gpu: b200
    epochs: 4

epochs: []
max_pending: 2

Hardware:
  server_gpu: [b200, h200, h100]   # overridden to b200 above
  client_gpu: p100
  gpu_count: 1
  replicas: 1
  gpu_memory_utilization: 0.85
  enforce_eager: True

Model:
  max_model_len: 8192
  max_num_seqs: 512
  max_num_batched_tokens: 8192
  dtype: "auto"
  thinking: False
  lora: False
  full_finetuning: False
  lora_modules: ""

Client_Job:
  chief_complaint: "all"
  file_name: "test_dataset"
  split: "test"
  wandb_tags: "test_data"
  num_choices: 4
  num_samples: 100000
  concurrency: 64
  start_verifier: 1
  budget: [4, 4, 4, 4]
  temperatures: [0.4, 0.4, 0.4, 0.4]
  max_tokens: [2000, 2000, 2000, 2200]
  thresholds: [0.6, 0.5, 0.8, 0.55]
  seed: 44
  eval_mode: True
  merlin_mode: True
  think_about_labs: False
  guided_decoding: False
