# Error-bar seed for the main table's "label-only (no traces)" row --
# 8B full-FT on mimic-2icd (ft-8b-full-mimic-2icd-v1-4), seed-43 half.
# Companion to eval_error_bars_config_seed44_mimic.yaml (seed 44). Split
# into its own file rather than folded into eval_error_bars_config_seed43_8b
# .yaml because that file's Hardware.client_gpu is v100 (matching the
# thrfull2icd checkpoint's convention) while this checkpoint's proven eval
# recipe uses p100 (see scripts/eval_checkpoints_config_test_8b_mimic_icd2
# .yaml) -- Hardware.client_gpu is shared by every entry in one config file,
# so it can't vary within a single file (same reasoning as the seed43_8b
# header).
#
# NO NEW SFT -- this only reruns eval_checkpoints.py at a different
# Client_Job.seed against the already-trained checkpoint; the generator-
# verifier pipeline's sampling varies but nothing is retrained. See
# eval_error_bars_config_seed43.yaml's header for the full seed-repeat
# rationale.
#
# Why this row specifically: src/eval/paper_tables.py's MAIN_ROWS has
# "test-8b-mimic-icd2-e4" (the label-only/no-reasoning-traces control) as a
# single-seed row -- every other main-table row now has a seed-43/44
# companion (Qwen sizes: eval_error_bars_config_seed4[34][_8b].yaml;
# externals: eval_error_bars_config_seed4[34]_external.yaml) except this
# one, so it's the last row still printing paper_tables.py's grey
# PENDING_STD ("$\pm$--") placeholder in table_main_body.tex.
#
# Checkpoint/epoch pinned to the same one already selected for the seed-42
# main-table row (see scripts/eval_checkpoints_config_test_8b_mimic_icd2
# .yaml): ft-8b-full-mimic-2icd-v1-4, epoch 4 (dev-split ICD F1 Macro peaks
# at e4 (12.51) vs e3 (12.25)).
#
# short_name carries a "-seed43" suffix so this doesn't collide with the
# existing seed-42 state-file entry / wandb run (test-8b-mimic-icd2-e4).
# src/wandb/run.py also auto-appends "-seed43" whenever Client_Job.seed !=
# 42, so the wandb run name ends up with the same harmless doubled suffix
# already documented in eval_error_bars_config_seed43.yaml (e.g.
# "test-8b-mimic-icd2-seed43-e4-seed43") -- paper_tables.py's SEED_SUFFIX
# regex strips exactly one "-seed4[34]", collapsing the job_name
# "test-8b-mimic-icd2-seed43-e4" back to the "test-8b-mimic-icd2-e4" group
# key, same as the other seed-repeat rows.
#
# Run:
#   python scripts/eval_checkpoints.py --config scripts/eval_error_bars_config_seed43_mimic.yaml

namespace: merlin
server_image: registry.example.com/anon/vllm_server:latest
client_image: registry.example.com/anon/vllm_client:latest

models_root: /ft_models/sft

pvc:
  tool_pod: tool-anon
  ft_root: /ft_models
  tool_root: /merlin_ddx

manifests:
  - path: /ft_models/sft/ft-8b-full-mimic-2icd-v1-4/checkpoints.json
    short_name: test-8b-mimic-icd2-seed43
    server_gpu: b200
    epochs: 4

epochs: []
max_pending: 2

Hardware:
  server_gpu: [b200, h200, h100]   # overridden to b200 above
  client_gpu: p100
  gpu_count: 1
  replicas: 1
  gpu_memory_utilization: 0.85
  enforce_eager: True

Model:
  max_model_len: 8192
  max_num_seqs: 512
  max_num_batched_tokens: 8192
  dtype: "auto"
  thinking: False
  lora: False
  full_finetuning: False
  lora_modules: ""

Client_Job:
  chief_complaint: "all"
  file_name: "test_dataset"
  split: "test"
  wandb_tags: "test_data"
  num_choices: 4
  num_samples: 100000
  concurrency: 64
  start_verifier: 1
  budget: [4, 4, 4, 4]
  temperatures: [0.4, 0.4, 0.4, 0.4]
  max_tokens: [2000, 2000, 2000, 2200]
  thresholds: [0.6, 0.5, 0.8, 0.55]
  seed: 43
  eval_mode: True
  merlin_mode: True
  think_about_labs: False
  guided_decoding: False
