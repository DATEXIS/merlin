# One-off repeat of the 8b-lora test-split eval (ft-8b-lora-r128-thrfull2icd-v1-4,
# epoch 3) -- flagged as a heavy outlier vs the rest of the test-set grid.
# Same params as the original scripts/eval_checkpoints_config_test.yaml (now
# removed, recoverable at bf0396c~1), trimmed to just this one manifest.
#
# job_name comes out as "test-8b-r128-e3", same as the first run -- already
# marked "ok" in data/results/eval_checkpoints_state.json, so this MUST be run
# with --force or the script will silently skip it as already done:
#
#   python scripts/eval_checkpoints.py \
#       --config scripts/eval_checkpoints_config_test_8b_r128_rerun.yaml --force
#
# Logs to merlin-eval (wandb_tags: test_data), same tag as the original run --
# distinguish the repeat by timestamp/run id, or delete the stale run in wandb
# first if you don't want both in eval_analysis.py's aggregation.
# Safe to delete this file after the run.

namespace: merlin
server_image: registry.example.com/anon/vllm_server:latest
client_image: registry.example.com/anon/vllm_client:latest

models_root: /ft_models/sft

pvc:
  tool_pod: tool-anon
  ft_root: /ft_models
  tool_root: /merlin_ddx

manifests:
  - path: /ft_models/sft/ft-8b-lora-r128-thrfull2icd-v1-4/checkpoints.json
    short_name: test-8b-r128
    server_gpu: h200
    epochs: 3

epochs: []
max_pending: 2

Hardware:
  server_gpu: [b200, h200, h100]   # overridden above
  client_gpu: v100
  gpu_count: 1
  replicas: 1
  gpu_memory_utilization: 0.85
  enforce_eager: True

Model:
  max_model_len: 8192
  max_num_seqs: 512
  max_num_batched_tokens: 8192
  dtype: "auto"
  thinking: False

Client_Job:
  chief_complaint: "all"
  file_name: "test_dataset"
  split: "test"                    # this is the test-set eval, not the dev sweep
  wandb_tags: "test_data"
  num_choices: 4
  num_samples: 100000
  concurrency: 64
  start_verifier: 1
  budget: [4, 4, 4, 4]
  temperatures: [0.4, 0.4, 0.4, 0.4]
  max_tokens: [2000, 2000, 2000, 2200]
  thresholds: [0.6, 0.5, 0.8, 0.55]
  seed: 42
  eval_mode: True
  merlin_mode: True
  think_about_labs: False
  guided_decoding: False
