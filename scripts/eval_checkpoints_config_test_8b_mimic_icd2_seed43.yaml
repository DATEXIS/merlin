# One-off TEST-split eval of the seed-43 TRAINED mimic-icd2 (no reasoning
# traces) checkpoint, ft-8b-full-mimic-2icd-seed43-v1-4 (run_plan.yaml,
# added 2026-07-29) -- completes the traces-vs-no-traces seed ablation's
# "no traces" arm alongside the existing "with traces" seed pair
# (ft-8b-full-thrfull2icd-seed{43,44}-v1-4, watch_sft_and_eval.py).
#
# Epoch pinned to 4: Jan confirmed (2026-07-29) epoch 4 is the dev-selected
# best epoch for BOTH the seed43 and seed44 retrains (dev sweep run via
# scripts/watch_epochs_mimic2icd_seed43.yaml) -- matches the seed-42
# checkpoint's own best epoch too (see
# eval_checkpoints_config_test_8b_mimic_icd2.yaml: dev ICD F1 Macro peaks at
# e4 there as well).
#
# NAMING -- do not rename short_name to "test-8b-mimic-icd2-seed43": that
# name is already reserved by scripts/eval_error_bars_config_seed43_mimic
# .yaml for a DIFFERENT experiment -- re-evaluating the SEED-42-TRAINED
# checkpoint (ft-8b-full-mimic-2icd-v1-4) at a different Client_Job sampling
# seed (43), no retraining involved. This config is the opposite: a
# genuinely SEED-43-TRAINED checkpoint, evaluated with a matching
# Client_Job.seed. Reusing that name here would silently conflate two
# different ablations under one wandb collection / state-file key.
# "test-8b-full-mimic-icd2-seed43" (with "-full-", matching this
# checkpoint's own dev-sweep short_name "8b-full-mimic-icd2-seed43" -- see
# scripts/watch_epochs_mimic2icd_seed43.yaml -- just "test-"-prefixed so it
# doesn't collide with THAT already-"ok" dev-sweep state entry either) keeps
# all three distinct.
#
# Downstream: like the thrfull2icd training-seed pair
# (ft-8b-full-thrfull2icd-seed{43,44}-v1-4), this is a TRAINING-seed
# robustness check, not an eval-time reseed -- its numbers belong with
# robustness_plots.py / eval_metrics_merlin-eval-1.4.csv directly, not
# paper_tables.py's SEED_SUFFIX-based grouping (that machinery is for the
# eval-only-reseed rows only -- see checkpoint_metrics.py's
# EVAL_SEED_TEST_FAMILY_RE comment). Wire it into robustness_plots.py's
# input list alongside the thrfull2icd pair once both seeds are done.
#
# short_name is "test-"-prefixed so it doesn't collide with the existing
# "8b-full-mimic-icd2-seed43-e*" dev-sweep state entries in
# data/results/eval_checkpoints_state.json -- job comes out as
# "test-8b-full-mimic-icd2-seed43-e4".
#
# Companion: eval_checkpoints_config_test_8b_mimic_icd2_seed44.yaml.
#
# Run:
#   python scripts/eval_checkpoints.py \
#       --config scripts/eval_checkpoints_config_test_8b_mimic_icd2_seed43.yaml
#
# Logs to merlin-eval (wandb_tags: test_data), same tag convention as the
# other test-split reruns. Safe to delete this file after the run.

namespace: merlin
server_image: registry.example.com/anon/vllm_server:latest
client_image: registry.example.com/anon/vllm_client:latest

models_root: /ft_models/sft

pvc:
  tool_pod: tool-anon
  ft_root: /ft_models
  tool_root: /merlin_ddx

manifests:
  - path: /ft_models/sft/ft-8b-full-mimic-2icd-seed43-v1-4/checkpoints.json
    short_name: test-8b-full-mimic-icd2-seed43
    server_gpu: b200
    epochs: 4

epochs: []
max_pending: 2

Hardware:
  server_gpu: [b200, h200, h100]   # overridden to b200 above
  client_gpu: p100
  gpu_count: 1
  replicas: 1
  gpu_memory_utilization: 0.85
  enforce_eager: True

Model:
  max_model_len: 8192
  max_num_seqs: 512
  max_num_batched_tokens: 8192
  dtype: "auto"
  thinking: False

Client_Job:
  chief_complaint: "all"
  file_name: "test_dataset"
  split: "test"                    # test-set eval, not the dev sweep
  wandb_tags: "test_data"
  num_choices: 4
  num_samples: 100000
  concurrency: 64
  start_verifier: 1
  budget: [4, 4, 4, 4]
  temperatures: [0.4, 0.4, 0.4, 0.4]
  max_tokens: [2000, 2000, 2000, 2200]
  thresholds: [0.6, 0.5, 0.8, 0.55]
  seed: 43                         # matches this checkpoint's training seed
  eval_mode: True
  merlin_mode: True
  think_about_labs: False
  guided_decoding: False
