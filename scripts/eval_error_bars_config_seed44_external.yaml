# Error-bar seed for the main bar plot -- external/competitor baselines half
# of the seed-44 sweep. Companion to eval_error_bars_config_seed44[.yaml|
# _8b.yaml] (Qwen3 sizes) and eval_error_bars_config_seed43_external.yaml
# (seed 43). See that file's header for the full rationale, scope (medgemma-
# 27b-it, llama-3.3-70b-instruct, meditron3-8b, baichuan-m2-32b -- baichuan
# is excluded from Figure 1 specifically but stays in as a Table 2 /
# table_main row, per Jan 2026-07-25), the wandb doubled-"-seed{N}"-suffix
# quirk, and all three open caveats (checkpoint_metrics.py parser coverage
# for seed-suffixed external names, the medgemma/llama/baichuan chat-template
# routing gap in is_model_chat_based, and Baichuan's reasoning-parser
# mismatch).
#
# Run:
#   python scripts/eval_base_models.py --config scripts/eval_error_bars_config_seed44_external.yaml

namespace: anon
server_image: registry.example.com/anon/vllm_server:latest
client_image: registry.example.com/anon/vllm_client:latest

models_root: /ft_models/sft

pvc:
  tool_pod: tool-anon
  ft_root: /ft_models
  tool_root: /merlin_ddx

models:
#  - job_name: test-meditron3-8b-seed44
#    base_model: "OpenMeditron/Meditron3-8B"
#    gpu_count: 1
#    server_gpu: h100
  - job_name: test-medgemma-27b-it-seed44
    base_model: "google/medgemma-27b-it"
    gpu_count: 1
    server_gpu: h200
  - job_name: test-llama-3-70b-instruct-seed44
    base_model: "meta-llama/Llama-3.3-70B-Instruct"
    gpu_count: 2
    server_gpu: b200
  - job_name: test-baichuan-m2-32b-seed44
    base_model: "baichuan-inc/Baichuan-M2-32B"
    gpu_count: 2
    server_gpu: b200

Hardware:
  server_gpu: [b200, h200, h100]   # overridden per model above
  client_gpu: p100                 # matches eval_external_models_config_test.yaml
  gpu_count: 1
  replicas: 1
  gpu_memory_utilization: 0.85
  enforce_eager: True

Model:
  max_model_len: 8192
  max_num_seqs: 512
  max_num_batched_tokens: 8192
  dtype: "auto"
  thinking: False   # see chat-template caveat in seed43_external.yaml
  lora: False
  full_finetuning: False
  lora_modules: ""

Client_Job:
  chief_complaint: "all"
  file_name: "test_dataset"
  split: "test"
  wandb_tags: "test_data"
  num_choices: 4
  num_samples: 100000
  concurrency: 64
  start_verifier: 1
  budget: [4, 4, 4, 4]
  temperatures: [0.4, 0.4, 0.4, 0.4]
  max_tokens: [2000, 2000, 2000, 2200]
  thresholds: [0.6, 0.5, 0.8, 0.55]
  seed: 44
  eval_mode: True
  merlin_mode: True
  think_about_labs: False
  guided_decoding: False
