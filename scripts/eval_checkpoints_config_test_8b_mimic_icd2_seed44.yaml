# One-off TEST-split eval of the seed-44 TRAINED mimic-icd2 (no reasoning
# traces) checkpoint, ft-8b-full-mimic-2icd-seed44-v1-4 (run_plan.yaml,
# added 2026-07-29). Companion to
# eval_checkpoints_config_test_8b_mimic_icd2_seed43.yaml -- see that file's
# header for the full naming rationale (do not rename short_name to
# "test-8b-mimic-icd2-seed44": that's reserved by
# eval_error_bars_config_seed44_mimic.yaml for the eval-only reseed of the
# SEED-42-trained checkpoint, a different experiment) and the downstream
# note (feeds robustness_plots.py, not paper_tables.py's SEED_SUFFIX
# grouping).
#
# Epoch pinned to 4: Jan confirmed (2026-07-29) epoch 4 is the dev-selected
# best epoch for both the seed43 and seed44 retrains.
#
# short_name is "test-8b-full-mimic-icd2-seed44" -- job comes out as
# "test-8b-full-mimic-icd2-seed44-e4".
#
# Run:
#   python scripts/eval_checkpoints.py \
#       --config scripts/eval_checkpoints_config_test_8b_mimic_icd2_seed44.yaml
#
# Logs to merlin-eval (wandb_tags: test_data). Safe to delete after the run.

namespace: merlin
server_image: registry.example.com/anon/vllm_server:latest
client_image: registry.example.com/anon/vllm_client:latest

models_root: /ft_models/sft

pvc:
  tool_pod: tool-anon
  ft_root: /ft_models
  tool_root: /merlin_ddx

manifests:
  - path: /ft_models/sft/ft-8b-full-mimic-2icd-seed44-v1-4/checkpoints.json
    short_name: test-8b-full-mimic-icd2-seed44
    server_gpu: b200
    epochs: 4

epochs: []
max_pending: 2

Hardware:
  server_gpu: [b200, h200, h100]   # overridden to b200 above
  client_gpu: p100
  gpu_count: 1
  replicas: 1
  gpu_memory_utilization: 0.85
  enforce_eager: True

Model:
  max_model_len: 8192
  max_num_seqs: 512
  max_num_batched_tokens: 8192
  dtype: "auto"
  thinking: False

Client_Job:
  chief_complaint: "all"
  file_name: "test_dataset"
  split: "test"                    # test-set eval, not the dev sweep
  wandb_tags: "test_data"
  num_choices: 4
  num_samples: 100000
  concurrency: 64
  start_verifier: 1
  budget: [4, 4, 4, 4]
  temperatures: [0.4, 0.4, 0.4, 0.4]
  max_tokens: [2000, 2000, 2000, 2200]
  thresholds: [0.6, 0.5, 0.8, 0.55]
  seed: 44                         # matches this checkpoint's training seed
  eval_mode: True
  merlin_mode: True
  think_about_labs: False
  guided_decoding: False
