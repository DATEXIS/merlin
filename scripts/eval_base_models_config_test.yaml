# Test-split eval of the raw Qwen3 base models (companion to the SFT test-set
# runs in scripts/eval_checkpoints_config_test_8b_r128_rerun.yaml). Same four
# models as eval_config.yaml's dev-split `models:` list, but split="test" and
# job_names prefixed "test-" so they don't collide with the dev-split base
# evals already logged under 32b-base / 14b-base / 8b-base / 06b-base.
#
# GPU allocation per Jan's 2026-07-21 plan:
#   0.6b -> 1x a100   8b -> 1x h200   14b -> 1x b200   32b -> 2x b200
#
# Run: python scripts/eval_base_models.py --config scripts/eval_base_models_config_test.yaml

namespace: merlin
server_image: registry.example.com/anon/vllm_server:latest
client_image: registry.example.com/anon/vllm_client:latest

models_root: /ft_models/sft

pvc:
  tool_pod: tool-anon
  ft_root: /ft_models
  tool_root: /merlin_ddx

models:
  - job_name: test-32b-base
    base_model: "Qwen/Qwen3-32B"
    gpu_count: 2
    server_gpu: b200
  - job_name: test-14b-base
    base_model: "Qwen/Qwen3-14B"
    gpu_count: 1
    server_gpu: b200
  - job_name: test-8b-base
    base_model: "Qwen/Qwen3-8B"
    gpu_count: 1
    server_gpu: h200
  - job_name: test-06b-base
    base_model: "Qwen/Qwen3-0.6B"
    gpu_count: 1
    server_gpu: a100

Hardware:
  server_gpu: [b200, h200, h100]   # overridden per model above
  client_gpu: [p100, v100]         # Jan's spec: "client p100 > v100"
  gpu_count: 1
  replicas: 1
  gpu_memory_utilization: 0.85
  enforce_eager: True

Model:
  max_model_len: 8192
  max_num_seqs: 512
  max_num_batched_tokens: 8192
  dtype: "auto"
  thinking: False
  lora: False
  full_finetuning: False
  lora_modules: ""

Client_Job:
  chief_complaint: "all"
  file_name: "test_dataset"
  split: "test"
  wandb_tags: "test_data"
  num_choices: 4
  num_samples: 100000
  concurrency: 64
  start_verifier: 1
  budget: [4, 4, 4, 4]
  temperatures: [0.4, 0.4, 0.4, 0.4]
  max_tokens: [2000, 2000, 2000, 2200]
  thresholds: [0.6, 0.5, 0.8, 0.55]
  seed: 42
  eval_mode: True
  merlin_mode: True
  think_about_labs: False
  guided_decoding: False
