# Watch ft-8b-lora-r256-thrfull2icd-v1-4 (4xB200, started 2026-07-21,
# currently epoch 3.3/4) and eval every checkpoint the moment training
# finishes -- no manual step once the job completes.
#
# This is the last hyperparameter attempt for the 8B LoRA / thrfull_icd2x
# JSON-validity collapse first seen at r128 (run_plan.yaml's "8c." entry;
# see memory 8b_lora_r128_thrfull2icd_degradation.md): lora_r bumped
# 128 -> 256, same dataset/recipe otherwise. DEV split (not test) because
# this is still epoch selection / does-the-rank-bump-fix-it triage, not
# paper reporting -- rerun the winning epoch on TEST once one looks fixed
# (see memory report_test_split_by_default.md). epochs: [] sweeps whatever
# checkpoints exist in the manifest once the job finishes (expect all 4).
#
# Hardware pinned per Jan (2026-07-21): server on b200, client on p100/v100
# only (excludes a100 -- eval_config.yaml's default client_gpu adds a100).
#
# Run (blocks until the job completes, then evaluates all 4 epochs on dev;
# safe to leave running in a terminal/tmux session for as long as training
# takes):
#   python scripts/watch_and_eval.py --config scripts/watch_and_eval_r256.yaml

job_name: ft-8b-lora-r256-thrfull2icd-v1-4
short_name: 8b-r256-thrfull-icd2
epochs: []

eval_config: scripts/eval_config.yaml

Client_Job:
  split: dev

Hardware:
  server_gpu: b200
  client_gpu: [p100, v100]
