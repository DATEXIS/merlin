# QA client Job: runs scripts/qa_analysis.py INSIDE the cluster so home-internet
# drops can't kill the run (the port-forward instability of 2026-07-17/18).
#
# One-time data sync to the PVC (from the repo root, via the tool pod). Only the
# eval_results_* dirs actually referenced in qa_config_cluster.yaml are needed --
# don't copy the whole 1_4 folder, it's ~70 result sets and most are unused.
#   kubectl exec tool-anon -n merlin -- mkdir -p /merlin_ddx/qa/data/results/evaluation/1_4 /merlin_ddx/qa/data/mimic-iv/discharge_notes/icd-10
#   for m in 8b-base 32b-base 8b-full-thrfull-icd2-e3 32b-full-thrfull-icd2-e3 32b-r256-thrfull-icd2-e4; do
#     kubectl cp "data/results/evaluation/1_4/eval_results_$m" "merlin/tool-anon:/merlin_ddx/qa/data/results/evaluation/1_4/eval_results_$m"
#   done
#   kubectl cp data/mimic-iv/discharge_notes/icd-10/hosp merlin/tool-anon:/merlin_ddx/qa/data/mimic-iv/discharge_notes/icd-10/hosp
#
# To free PVC space if the full 1_4 folder (or the 8b-r128 set) was already
# copied, remove everything except what's configured:
#   kubectl exec tool-anon -n merlin -- bash -c '
#     cd /merlin_ddx/qa/data/results/evaluation/1_4 &&
#     find . -mindepth 1 -maxdepth 1 -type d \
#       ! -name eval_results_8b-base \
#       ! -name eval_results_32b-base \
#       ! -name eval_results_8b-full-thrfull-icd2-e3 \
#       ! -name eval_results_32b-full-thrfull-icd2-e3 \
#       ! -name eval_results_32b-r256-thrfull-icd2-e4 \
#       -exec rm -rf {} +'
#
# Run (judge must already be up: `python scripts/qa_analysis.py server --up`):
#   kubectl apply -f k8s/qa_client_job.yaml
#   kubectl logs -f job/qa-client -n merlin
# Change the `args` line to run stage2 instead. Re-apply needs a delete first
# (Job specs are immutable): kubectl delete job qa-client -n merlin
#
# Requires the vllm_client image to include scripts/ (deployment/Dockerfile.vllm_client
# copies it; rebuild with scripts/docker_build.py after code changes).
apiVersion: batch/v1
kind: Job
metadata:
  name: qa-client
  namespace: merlin
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: private-registry-auth
      containers:
        - name: qa-client
          image: registry.example.com/anon/vllm_client:latest
          workingDir: /app
          command: ["python3", "scripts/qa_analysis.py"]
          args: ["stage2", "--config", "scripts/qa_config_cluster.yaml"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-secret
                  key: api-key
          resources:
            requests:
              memory: "8Gi"
              cpu: "2"
            limits:
              memory: "32Gi"
          volumeMounts:
            - name: merlin-ddx-pvc
              mountPath: /merlin_ddx
      volumes:
        - name: merlin-ddx-pvc
          persistentVolumeClaim:
            claimName: merlin-ddx-ckpts-pvc
